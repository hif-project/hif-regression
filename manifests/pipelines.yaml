# Named, ordered operation sequences. A design selects one by name (sidecar
# "pipeline" key) or inherits its category's suite_defaults entry - most
# designs never need to say anything.
#
# Each operation has:
#   id    - unique within the pipeline, independent of the implementation
#           name (a tool can legitimately appear more than once - verilog2hif
#           does, as both the initial parse and the final reparse). Doubles as
#           the stage key in the JSON report.
#   kind  - tool | simulation | validation. These are three distinct concepts:
#           a tool consumes and produces artifacts, a simulation executes one
#           and produces result traces, a validation asserts something about
#           those results. None of them is disguised as another.
#   use   - the entry to use from the registry for that kind (tools.yaml,
#           simulators.yaml, validators.yaml).
#
# Operations execute strictly top to bottom, stopping at the first non-PASS.
# There is no dependency resolution, no topological sort and no parallelism.
# An operation with no explicit `inputs` consumes its predecessor's artifact,
# which keeps linear pipelines terse; an explicit `inputs: [<id>]` names an
# earlier operation, which is how a step reads something other than what came
# immediately before it.

pipelines:
  plain_roundtrip:
    operations:
      - {id: frontend, kind: tool, use: verilog2hif}
      - {id: backend,  kind: tool, use: hif2verilog}
      - {id: reparse,  kind: tool, use: verilog2hif}

  muffin_roundtrip:
    operations:
      - {id: frontend, kind: tool, use: verilog2hif}
      - {id: backend,  kind: tool, use: hif2verilog}
      - {id: reparse,  kind: tool, use: verilog2hif}
      # Both of these examine the frontend's output rather than the previous
      # operation's - neither feeds into backend regeneration. That used to be
      # expressed by a separate `probes` section; it is now just an explicit
      # input reference. Ids and order are unchanged, so report stage keys
      # stayed stable across the migration.
      - {id: muffin_list_faults, kind: tool, use: muffin_list_faults, inputs: [frontend]}
      - {id: muffin_instrument,  kind: tool, use: muffin_instrument,  inputs: [frontend]}

suite_defaults:
  combinational: plain_roundtrip
  sequential: plain_roundtrip
  parameterized: plain_roundtrip
  hierarchical: plain_roundtrip
  structural: plain_roundtrip
