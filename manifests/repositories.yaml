# HIF toolchain build graph: what to build, and in what order.
#
# depends_on means "must be built (and installed into the shared prefix)
# before this repo's own configure/build/test cycle" - not necessarily a
# direct CMake link-time dependency. E.g. hif-backend only hard-requires
# hif-core at configure time (find_package(HIF REQUIRED)); hif-frontend is
# listed as a dependency anyway because hif-backend's own CTest suite
# discovers verilog2hif via a sibling-build find_program lookup, and needs
# it already built to run those tests rather than skip them. Same reasoning
# for hif-muffin depending on both hif-frontend and hif-backend.
#
# cmake_args_template entries are configure-time flags with {prefix}
# substituted for the shared install prefix (see build_toolchain.py).
# hif-core has none - it has no HIF dependency of its own.

hif-core:
  repository: https://github.com/esd-univr/hif-core.git
  depends_on: []
  cmake_args_template: []

hif-frontend:
  repository: https://github.com/esd-univr/hif-frontend.git
  depends_on: [hif-core]
  cmake_args_template: ["-DHIF_DIR={prefix}"]

hif-backend:
  repository: https://github.com/esd-univr/hif-backend.git
  depends_on: [hif-core, hif-frontend]
  cmake_args_template: ["-DHIF_DIR={prefix}"]

hif-muffin:
  repository: https://github.com/esd-univr/hif-muffin.git
  depends_on: [hif-core, hif-frontend, hif-backend]
  cmake_args_template: ["-DHIF_DIR={prefix}"]
