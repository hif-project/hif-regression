# state, moore and mealy each have one fault location.
#
# Two contrasting injections:
#
# 1. state bit 0 stuck high. The forced value feeds back into the next-state
#    logic, so the machine never reaches DONE (2) at all: it alternates
#    1 -> 3 -> 1 -> ... Moore goes dead (it only asserts in DONE) while Mealy
#    still fires whenever the derailed state happens to read as RUN and go is
#    high. One fault, two differently-shaped output effects.
#
# 2. moore stuck high. The state sequence is untouched; only the reported
#    output changes. This is what distinguishes corrupting the machine from
#    corrupting its report.

runs:
  - {id: golden, params: {mut: 0}}

  - id: sa1_state_bit0
    params:
      mut: {from: enumerate, array: faults, where: {signal: state, bit: 0, type: stuck-at-1}, take: id}

  - id: sa1_moore
    params:
      mut: {from: enumerate, array: faults, where: {signal: moore, bit: 0, type: stuck-at-1}, take: id}

expectations:
  - id: golden_matches_rtl
    use: trace_equal
    left:  {from: simulate_reference,    run: reference}
    right: {from: simulate_instrumented, run: golden}

  - id: sa1_state_bit0_expected_trace
    use: expected_trace
    left:     {from: simulate_instrumented, run: sa1_state_bit0}
    expected: {fixture: expect_sa1_state_bit0}

  - id: sa1_moore_expected_trace
    use: expected_trace
    left:     {from: simulate_instrumented, run: sa1_moore}
    expected: {fixture: expect_sa1_moore}

  - id: sa1_state_bit0_detected
    use: trace_differs
    left:  {from: simulate_instrumented, run: sa1_state_bit0}
    right: {from: simulate_reference,    run: reference}
